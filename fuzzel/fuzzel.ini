[main]
font=JetBrainsMonoNL Nerd Font Propo,JetBrainsMonoNL NFP,JetBrainsMonoNL NFP Medium Sans:size=4
dpi-aware=no
prompt=" "
icon-theme=Papirus-Dark
icons-enabled=yes
fields=filename,name,generic,exec,keywords
password-character=*
filter-desktop=yes
match-mode=fzf
sort-result=yes
anchor=top-left
x-margin=10
y-margin=10
terminal=gnome-terminal
show-actions=yes

# Window Geometry
lines=12
width=32
tabs=4
horizontal-pad=7
vertical-pad=7
inner-pad=7


# Layout & Border
line-height=24
letter-spacing=0
layer=top
exit-on-keyboard-focus-loss=yes

[colors]
background=000000dd
text=ffffffff
prompt=ccccccff
placeholder=666666ff
input=ffffffff
match=ffffffff
selection=333333ff
selection-text=ffffffff
selection-match=ffffffff
counter=666666ff
border=ffffff33

[border]
width=2
radius=4

[dmenu]
mode=text
exit-immediately-if-empty=yes
